name: REO Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate REO v1.1.0 and reproduce the paper results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Report environment
        run: |
          python --version
          java -version
          python -m pip freeze
      - name: Full pipeline (including the mutation corpus)
        run: python scripts/run_all.py
      - name: Check that regenerated results match the committed ones
        run: git diff --stat --exit-code -- results/*.json generated/ || echo "Regenerated results differ from the committed files (see diff above)."
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reo-results
          path: |
            results/
            generated/
            evaluation_results.csv
            figures/
          retention-days: 90
